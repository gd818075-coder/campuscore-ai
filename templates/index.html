<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GM Smart University — Premier University & AI Campus Management Portal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gmu: {
              navy: '#002B49',
              dark: '#081B2D',
              blue: '#0E3A5D',
              royal: '#1E40AF',
              accent: '#2563EB',
              gold: '#D4AF37',
              goldHover: '#C5A059',
              goldLight: '#FEF9E7',
              goldDark: '#9A7D0A',
              slate: '#F8FAFC'
            }
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Playfair Display + Outfit + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons & Chart.js -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      scroll-behavior: smooth;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Outfit', sans-serif;
    }
    .font-heritage {
      font-family: 'Playfair Display', serif;
    }
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #DFBA46 0%, #C5A059 50%, #9A7D0A 100%);
    }
    .navy-gradient {
      background: linear-gradient(135deg, #002B49 0%, #081B2D 100%);
    }
    .glass-navy {
      background: rgba(0, 43, 73, 0.95);
      backdrop-filter: blur(12px);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    /* Marquee ticker animation */
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 28s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-gmu-gold selection:text-gmu-navy">
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = "";


    // -------------------------------------------------------------------------
    // MAIN APPLICATION CONTROLLER & CLIENT-SIDE ROUTER
    // -------------------------------------------------------------------------
    function App() {
      // Path-based routing: "/", "/admin/login", "/faculty/login", "/student/login",
      // "/admin/dashboard", "/faculty/dashboard", "/student/dashboard"
      const [currentPath, setCurrentPath] = useState(window.location.pathname || "/");
      const [activeTab, setActiveTab] = useState("dashboard");
      const [currentUser, setCurrentUser] = useState({
        user_id: 1,
        username: "admin",
        full_name: "Dean / Chief Administrator",
        email: "admin@campuscore.edu",
        role: "Administrator"
      });
      const [toast, setToast] = useState(null);
      const [notifications, setNotifications] = useState([]);
      const [systemStatus, setSystemStatus] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(true);

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3800);
      };

      // Navigate function updates browser history and view state
      const navigateTo = (path, targetTab = "dashboard") => {
        window.history.pushState(null, "", path);
        setCurrentPath(path);
        if (targetTab) setActiveTab(targetTab);
        window.scrollTo({ top: 0, behavior: "smooth" });
        setTimeout(() => {
          if (window.lucide) window.lucide.createIcons();
        }, 150);
      };

      // Handle browser back/forward buttons
      useEffect(() => {
        const handlePopState = () => {
          setCurrentPath(window.location.pathname || "/");
          setTimeout(() => {
            if (window.lucide) window.lucide.createIcons();
          }, 150);
        };
        window.addEventListener("popstate", handlePopState);
        return () => window.removeEventListener("popstate", handlePopState);
      }, []);

      // Initial Fetch
      useEffect(() => {
        fetch(`${API_BASE}/api/auth/me`)
          .then(r => r.json())
          .then(d => { if (d.success && d.user) setCurrentUser(d.user); })
          .catch(() => {});

        fetch(`${API_BASE}/api/system/status`)
          .then(r => r.json())
          .then(d => { if (d.success) setSystemStatus(d); })
          .catch(() => {});

        fetch(`${API_BASE}/api/notifications`)
          .then(r => r.json())
          .then(d => { if (d.success) setNotifications(d.notifications || []); })
          .catch(() => {});
      }, []);

      // Re-initialize Lucide icons on view change
      useEffect(() => {
        setTimeout(() => {
          if (window.lucide) window.lucide.createIcons();
        }, 200);
      }, [currentPath, activeTab]);

      const handleLoginSuccess = (user, redirectUrl) => {
        setCurrentUser(user);
        showToast(`Welcome back, ${user.full_name}!`, "success");
        if (redirectUrl) {
          navigateTo(redirectUrl);
        } else if (user.role === "Administrator") {
          navigateTo("/admin/dashboard");
        } else if (user.role === "Faculty") {
          navigateTo("/faculty/dashboard");
        } else if (user.role === "Student") {
          navigateTo("/student/dashboard");
        } else {
          navigateTo("/admin/dashboard");
        }
      };

      const handleLogout = () => {
        fetch(`${API_BASE}/api/auth/logout`, { method: "POST" })
          .finally(() => {
            showToast("Signed out successfully. Session closed.", "info");
            navigateTo("/");
          });
      };

      const handleRoleSwitch = (role) => {
        fetch(`${API_BASE}/api/auth/switch-role`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role })
        })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              setCurrentUser(data.user);
              showToast(`Active role switched to ${role}!`, "info");
              fetch(`${API_BASE}/api/notifications`)
                .then(r => r.json())
                .then(d => { if (d.success) setNotifications(d.notifications || []); });
            }
          });
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans">
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white font-medium transition-all transform animate-bounce ${
              toast.type === "success" ? "bg-emerald-600 border border-emerald-400" :
              toast.type === "alert" ? "bg-rose-600 border border-rose-400" : "bg-gmu-navy border border-gmu-gold"
            }`}>
              <i className="lucide-sparkles w-4 h-4 text-gmu-gold"></i>
              <span>{toast.message}</span>
            </div>
          )}

          {/* VIEW ROUTING */}
          {currentPath === "/admin/login" ? (
            <AdminLoginPage 
              navigateTo={navigateTo} 
              onLoginSuccess={handleLoginSuccess} 
              showToast={showToast} 
            />
          ) : currentPath === "/faculty/login" ? (
            <FacultyLoginPage 
              navigateTo={navigateTo} 
              onLoginSuccess={handleLoginSuccess} 
              showToast={showToast} 
            />
          ) : currentPath === "/student/login" ? (
            <StudentLoginPage 
              navigateTo={navigateTo} 
              onLoginSuccess={handleLoginSuccess} 
              showToast={showToast} 
            />
          ) : currentPath === "/admin/dashboard" ? (
            <AdminDashboard 
              currentUser={currentUser}
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              navigateTo={navigateTo}
              onLogout={handleLogout}
              onRoleSwitch={handleRoleSwitch}
              showToast={showToast}
              notifications={notifications}
              setNotifications={setNotifications}
              systemStatus={systemStatus}
              sidebarOpen={sidebarOpen}
              setSidebarOpen={setSidebarOpen}
            />
          ) : currentPath === "/faculty/dashboard" ? (
            <FacultyDashboard 
              currentUser={currentUser}
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              navigateTo={navigateTo}
              onLogout={handleLogout}
              onRoleSwitch={handleRoleSwitch}
              showToast={showToast}
              notifications={notifications}
              setNotifications={setNotifications}
              systemStatus={systemStatus}
              sidebarOpen={sidebarOpen}
              setSidebarOpen={setSidebarOpen}
            />
          ) : currentPath === "/student/dashboard" ? (
            <StudentDashboard 
              currentUser={currentUser}
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              navigateTo={navigateTo}
              onLogout={handleLogout}
              onRoleSwitch={handleRoleSwitch}
              showToast={showToast}
              notifications={notifications}
              setNotifications={setNotifications}
              systemStatus={systemStatus}
              sidebarOpen={sidebarOpen}
              setSidebarOpen={setSidebarOpen}
            />
          ) : currentPath === "/dashboard" ? (
            currentUser.role === "Faculty" ? (
              <FacultyDashboard 
                currentUser={currentUser}
                activeTab={activeTab}
                setActiveTab={setActiveTab}
                navigateTo={navigateTo}
                onLogout={handleLogout}
                onRoleSwitch={handleRoleSwitch}
                showToast={showToast}
                notifications={notifications}
                setNotifications={setNotifications}
                systemStatus={systemStatus}
                sidebarOpen={sidebarOpen}
                setSidebarOpen={setSidebarOpen}
              />
            ) : currentUser.role === "Student" ? (
              <StudentDashboard 
                currentUser={currentUser}
                activeTab={activeTab}
                setActiveTab={setActiveTab}
                navigateTo={navigateTo}
                onLogout={handleLogout}
                onRoleSwitch={handleRoleSwitch}
                showToast={showToast}
                notifications={notifications}
                setNotifications={setNotifications}
                systemStatus={systemStatus}
                sidebarOpen={sidebarOpen}
                setSidebarOpen={setSidebarOpen}
              />
            ) : (
              <AdminDashboard 
                currentUser={currentUser}
                activeTab={activeTab}
                setActiveTab={setActiveTab}
                navigateTo={navigateTo}
                onLogout={handleLogout}
                onRoleSwitch={handleRoleSwitch}
                showToast={showToast}
                notifications={notifications}
                setNotifications={setNotifications}
                systemStatus={systemStatus}
                sidebarOpen={sidebarOpen}
                setSidebarOpen={setSidebarOpen}
              />
            )
          ) : (
            <UniversityWebsite 
              navigateTo={navigateTo}
              currentUser={currentUser}
              onRoleSwitch={handleRoleSwitch}
              showToast={showToast}
            />
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // 1. PUBLIC UNIVERSITY WEBSITE (GM UNIVERSITY INSPIRATION)
    // -------------------------------------------------------------------------
    function UniversityWebsite({ navigateTo, currentUser, onRoleSwitch, showToast }) {
      const [events, setEvents] = useState([]);
      const [admissionsForm, setAdmissionsForm] = useState({
        full_name: "", email: "", phone: "", program_interested: "BCA with AI Specialization", academic_score: "", message: ""
      });
      const [contactForm, setContactForm] = useState({
        name: "", email: "", subject: "", message: ""
      });
      const [submittingInquiry, setSubmittingInquiry] = useState(false);
      const [submittingContact, setSubmittingContact] = useState(false);
      const [activeHeroSlide, setActiveHeroSlide] = useState(0);

      const heroSlides = [
        {
          title: "Empowering Next-Gen Leaders in Artificial Intelligence & Computing",
          subtitle: "Ranked among India's premier multidisciplinary institutions with world-class faculty and NVIDIA-powered supercomputing labs.",
          image: "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=1600&q=80",
          tag: "Admissions Open 2024-25"
        },
        {
          title: "State-of-the-Art Innovation, Robotics & Deep Learning Research",
          subtitle: "Hands-on project-based curriculum integrating real-world machine learning, full-stack architectures, and industry internships.",
          image: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1600&q=80",
          tag: "AI Center of Excellence"
        },
        {
          title: "A Vibrant 54-Acre Lush Green Campus Designed for Holistic Growth",
          subtitle: "Olympic-grade sports pavilion, acoustic auditoriums, air-conditioned smart lecture complexes, and residential facilities.",
          image: "https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=1600&q=80",
          tag: "Holistic Campus Life"
        }
      ];

      useEffect(() => {
        const timer = setInterval(() => {
          setActiveHeroSlide(prev => (prev + 1) % heroSlides.length);
        }, 6000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        fetch(`${API_BASE}/api/events`)
          .then(r => r.json())
          .then(d => { if (d.success) setEvents(d.events || []); });
      }, []);

      const handleAdmissionInquiry = (e) => {
        e.preventDefault();
        setSubmittingInquiry(true);
        fetch(`${API_BASE}/api/admissions/inquire`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(admissionsForm)
        })
          .then(r => r.json())
          .then(data => {
            setSubmittingInquiry(false);
            if (data.success) {
              showToast(data.message, "success");
              setAdmissionsForm({
                full_name: "", email: "", phone: "", program_interested: "BCA with AI Specialization", academic_score: "", message: ""
              });
            } else {
              showToast(data.message, "alert");
            }
          })
          .catch(() => setSubmittingInquiry(false));
      };

      const handleContactSubmit = (e) => {
        e.preventDefault();
        setSubmittingContact(true);
        fetch(`${API_BASE}/api/contact`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(contactForm)
        })
          .then(r => r.json())
          .then(data => {
            setSubmittingContact(false);
            if (data.success) {
              showToast(data.message, "success");
              setContactForm({ name: "", email: "", subject: "", message: "" });
            } else {
              showToast(data.message, "alert");
            }
          })
          .catch(() => setSubmittingContact(false));
      };

      return (
        <div className="flex-1 flex flex-col">
          {/* 1. TOP UTILITY BAR (GMU STYLE) */}
          <div className="bg-gmu-dark text-slate-300 text-xs border-b border-gmu-blue/40 px-4 sm:px-8 py-2 flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-4 flex-wrap">
              <span className="flex items-center gap-1.5 text-gmu-gold font-medium">
                <i className="lucide-award w-3.5 h-3.5"></i> UGC Recognized • NAAC 'A' Grade • NIRF Ranked
              </span>
              <span className="hidden md:inline text-slate-500">|</span>
              <span className="hidden md:flex items-center gap-1.5 text-slate-300">
                <i className="lucide-phone-call w-3.5 h-3.5 text-gmu-gold"></i> Helpline: 1800-123-4682
              </span>
              <span className="hidden lg:flex items-center gap-1.5 text-slate-300">
                <i className="lucide-mail w-3.5 h-3.5 text-gmu-gold"></i> admissions@gmuniversity.edu
              </span>
            </div>

            <div className="flex items-center gap-3">
              <a href="#portals" className="text-gmu-gold hover:text-white font-semibold transition flex items-center gap-1">
                <i className="lucide-shield-check w-3.5 h-3.5"></i> Institutional Portals
              </a>
              <span className="text-slate-500">|</span>
              <a href="#admissions" className="px-2.5 py-0.5 rounded gold-gradient text-gmu-dark font-bold hover:brightness-110 text-[11px] shadow-sm flex items-center gap-1">
                <i className="lucide-sparkles w-3 h-3"></i> Admissions 2024-25 Open
              </a>
            </div>
          </div>

          {/* 2. MAIN UNIVERSITY HEADER & NAVIGATION */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
              <a href="#" className="flex items-center gap-3.5 group">
                <div className="w-12 h-12 rounded-xl gold-gradient flex items-center justify-center text-gmu-dark font-heritage font-bold text-xl shadow-md border-2 border-white">
                  GMU
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-heading font-extrabold text-lg sm:text-xl text-gmu-navy tracking-tight leading-none group-hover:text-gmu-royal transition">
                      GM UNIVERSITY
                    </span>
                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-amber-50 text-gmu-goldDark font-bold border border-amber-200">
                      DAVANGERE
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-500 font-medium tracking-wide mt-0.5">
                    CampusCore AI Smart University Ecosystem
                  </p>
                </div>
              </a>

              <nav className="hidden xl:flex items-center gap-6 text-xs font-semibold text-slate-700">
                <a href="#about" className="hover:text-gmu-navy transition">About GMU</a>
                <a href="#portals" className="hover:text-gmu-navy transition text-gmu-royal font-bold">Portal Gateways</a>
                <a href="#academics" className="hover:text-gmu-navy transition">Academics</a>
                <a href="#facilities" className="hover:text-gmu-navy transition">AI & Labs</a>
                <a href="#events" className="hover:text-gmu-navy transition">Events</a>
                <a href="#admissions" className="hover:text-gmu-navy transition">Admissions</a>
                <a href="#contact" className="hover:text-gmu-navy transition">Contact</a>
              </nav>

              <div className="flex items-center gap-2.5">
                <a 
                  href="#portals"
                  className="px-4 py-2 rounded-xl bg-gmu-navy hover:bg-gmu-blue text-white text-xs font-bold shadow-md hover:shadow-lg transition flex items-center gap-2 border border-gmu-gold/50"
                >
                  <i className="lucide-lock w-3.5 h-3.5 text-gmu-gold"></i>
                  <span>Login Portals</span>
                </a>
              </div>
            </div>

            {/* LIVE SCROLLING ANNOUNCEMENT TICKER */}
            <div className="bg-gmu-navy text-slate-200 text-xs py-1.5 px-4 overflow-hidden border-t border-gmu-blue/50 flex items-center">
              <span className="bg-gmu-gold text-gmu-navy px-2 py-0.5 rounded text-[10px] font-extrabold uppercase tracking-wider flex-shrink-0 mr-3 flex items-center gap-1">
                <i className="lucide-bell w-3 h-3"></i> Announcement
              </span>
              <div className="overflow-hidden relative w-full">
                <div className="animate-marquee text-slate-200 font-medium">
                  ✦ Admissions Open for BCA (Specialization in AI & Data Science) and MCA 2024-25 ✦ 36-Hour National Robotics & AI Hackathon Scheduled on Nov 20 ✦ Semester 1 Continuous Internal Assessment (CIA) Marks Available in Student Portal ✦ Mandatory 75% Attendance Compliance Review Underway ✦ Smart Campus AI Assistant 2.0 Live.
                </div>
              </div>
            </div>
          </header>

          {/* 3. HERO SECTION WITH IMAGE SLIDER */}
          <section className="relative min-h-[560px] flex items-center overflow-hidden bg-gmu-dark text-white">
            {heroSlides.map((slide, idx) => (
              <div 
                key={idx}
                className={`absolute inset-0 transition-opacity duration-1000 ease-in-out ${
                  idx === activeHeroSlide ? "opacity-100 scale-100" : "opacity-0 scale-105 pointer-events-none"
                }`}
                style={{
                  backgroundImage: `linear-gradient(to right, rgba(0, 43, 73, 0.94) 0%, rgba(8, 27, 45, 0.82) 60%, rgba(0, 0, 0, 0.5) 100%), url(${slide.image})`,
                  backgroundSize: 'cover',
                  backgroundPosition: 'center'
                }}
              ></div>
            ))}

            <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-8 py-20 w-full">
              <div className="max-w-2xl space-y-5">
                <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold gold-gradient text-gmu-dark shadow-md">
                  <i className="lucide-sparkles w-3.5 h-3.5"></i> {heroSlides[activeHeroSlide].tag}
                </span>

                <h1 className="font-heritage text-3xl sm:text-5xl font-extrabold text-white leading-tight tracking-tight drop-shadow-md">
                  {heroSlides[activeHeroSlide].title}
                </h1>

                <p className="text-slate-200 text-sm sm:text-base leading-relaxed drop-shadow">
                  {heroSlides[activeHeroSlide].subtitle}
                </p>

                <div className="pt-3 flex flex-wrap gap-3">
                  <a 
                    href="#portals"
                    className="px-6 py-3 rounded-xl gold-gradient text-gmu-dark font-extrabold text-xs uppercase tracking-wider hover:brightness-110 shadow-xl transition flex items-center gap-2"
                  >
                    <i className="lucide-shield-check w-4 h-4"></i>
                    <span>Access Campus Login Gateways</span>
                  </a>
                  <a 
                    href="#admissions"
                    className="px-6 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white font-semibold text-xs uppercase tracking-wider backdrop-blur-md border border-white/20 shadow-md transition flex items-center gap-2"
                  >
                    <span>Apply for 2024-25 Admission</span>
                    <i className="lucide-arrow-right w-4 h-4"></i>
                  </a>
                </div>
              </div>
            </div>

            {/* Slider Dots */}
            <div className="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-20 flex items-center gap-2">
              {heroSlides.map((_, i) => (
                <button 
                  key={i}
                  onClick={() => setActiveHeroSlide(i)}
                  className={`h-2.5 rounded-full transition-all ${
                    i === activeHeroSlide ? "w-8 bg-gmu-gold" : "w-2.5 bg-white/40 hover:bg-white/70"
                  }`}
                  title={`Slide ${i + 1}`}
                />
              ))}
            </div>
          </section>

          {/* 4. UNIVERSITY KEY STATS BAR */}
          <section className="bg-gmu-navy text-white py-8 border-y-4 border-gmu-gold relative shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-8 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 text-center">
              <div>
                <p className="font-heading text-2xl sm:text-3xl font-extrabold text-gmu-gold">54+ Acres</p>
                <p className="text-xs text-slate-300 font-medium mt-1">Lush Green Campus</p>
              </div>
              <div>
                <p className="font-heading text-2xl sm:text-3xl font-extrabold text-gmu-gold">15,000+</p>

    // -------------------------------------------------------------------------
    // 2. SEPARATE ADMIN LOGIN PAGE (/admin/login)
    // -------------------------------------------------------------------------
    function AdminLoginPage({ navigateTo, onLoginSuccess, showToast }) {
      const [adminId, setAdminId] = useState("admin");
      const [password, setPassword] = useState("admin123");
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [showForgot, setShowForgot] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setLoading(true);
        setError("");
        fetch(`${API_BASE}/api/auth/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ admin_id: adminId, password })
        })
          .then(r => r.json().then(data => ({ status: r.status, data })))
          .then(({ status, data }) => {
            setLoading(false);
            if (data.success) {
              onLoginSuccess(data.user, data.redirect_url || "/admin/dashboard");
            } else {
              setError(data.message || "Invalid administrative credentials.");
              showToast(data.message, "alert");
            }
          })
          .catch(() => {
            setLoading(false);
            setError("Network error connecting to administrative authentication gateway.");
          });
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col justify-between relative overflow-hidden">
          <div className="absolute inset-0 bg-[radial-gradient(#d4af37_1px,transparent_1px)] [background-size:24px_24px] opacity-10 pointer-events-none"></div>

          <header className="relative z-10 px-6 py-4 flex items-center justify-between border-b border-slate-800 bg-slate-950/80 backdrop-blur-md">

              <div className="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center text-gmu-dark font-heritage font-bold text-lg shadow-md">

              </div>

                <span className="font-heading font-extrabold text-white text-base tracking-tight">GM UNIVERSITY</span>
                <p className="text-[10px] text-gmu-gold font-medium">Administrative Governance Gateway</p>
              </div>
            </button>
            <button 
              onClick={() => navigateTo("/")} 
              className="text-xs text-slate-300 hover:text-white flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 transition"
            >
              <i className="lucide-arrow-left w-3.5 h-3.5"></i>
              <span>Back to University Home</span>
            </button>
          </header>

          {/* Login Card */}
          <div className="relative z-10 flex-1 flex items-center justify-center p-4">

                </div>

                  Institutional Administration
                </span>
                <h1 className="font-heritage text-2xl font-bold text-white">Administrator Login</h1>
                <p className="text-xs text-slate-400">Enter your institutional Admin ID or registered email</p>
              </div>

              {error && (
                <div className="p-3.5 bg-rose-950/70 border border-rose-500/50 rounded-xl text-xs text-rose-300 flex items-start gap-2.5">
                  <i className="lucide-alert-octagon w-4 h-4 text-rose-400 flex-shrink-0 mt-0.5"></i>
                  <span className="leading-relaxed">{error}</span>
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4 text-xs">

                    />
                  </div>
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="font-semibold text-slate-300">Master Password</label>
                    <button type="button" onClick={() => setShowForgot(true)} className="text-gmu-gold hover:underline text-[11px]">

                  </div>
                  <div className="relative">
                    <i className="lucide-lock w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                    <input
                      type={showPassword ? "text" : "password"}

                <button

                <span>Student? <button onClick={() => navigateTo("/student/login")} className="text-blue-400 font-semibold hover:underline">Student Login</button></span>
              </div>
            </div>
          </div>

          <footer className="relative z-10 px-6 py-3 text-center text-[11px] text-slate-500 border-t border-slate-800">
            GM University Davangere • CampusCore AI Role-Isolated Authentication Framework
          </footer>

          {showForgot && <ForgotPasswordModal role="Administrator" onClose={() => setShowForgot(false)} showToast={showToast} />}

          <footer className="relative z-10 px-6 py-3 text-center text-[11px] text-slate-500 border-t border-slate-800">
            GM University Davangere • Faculty Academic Instruction Portal
          </footer>

          {showForgot && <ForgotPasswordModal role="Faculty" onClose={() => setShowForgot(false)} showToast={showToast} />}
        </div>
      );

    // -------------------------------------------------------------------------
    // 4. SEPARATE STUDENT LOGIN PAGE (/student/login)
    // -------------------------------------------------------------------------
    function StudentLoginPage({ navigateTo, onLoginSuccess, showToast }) {
      const [studentId, setStudentId] = useState("BCA24001");
      const [password, setPassword] = useState("student123");
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [showForgot, setShowForgot] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setLoading(true);
        setError("");
        fetch(`${API_BASE}/api/auth/student/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ student_id: studentId, password })
        })
          .then(r => r.json().then(data => ({ status: r.status, data })))
          .then(({ status, data }) => {
            setLoading(false);
            if (data.success) {
              onLoginSuccess(data.user, data.redirect_url || "/student/dashboard");
            } else {
              setError(data.message || "Invalid student credentials.");
              showToast(data.message, "alert");
            }
          })
          .catch(() => {
            setLoading(false);
            setError("Network error connecting to student academic portal.");
          });
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col justify-between relative overflow-hidden">
          <div className="absolute inset-0 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:24px_24px] opacity-10 pointer-events-none"></div>

          {/* Top Bar */}
          <header className="relative z-10 px-6 py-4 flex items-center justify-between border-b border-slate-800 bg-slate-950/80 backdrop-blur-md">
            <button onClick={() => navigateTo("/")} className="flex items-center gap-3 group text-left">
              <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-heritage font-bold text-lg shadow-md">
                GMU
              </div>
              <div>
                <span className="font-heading font-extrabold text-white text-base tracking-tight">GM UNIVERSITY</span>
                <p className="text-[10px] text-blue-400 font-medium">Student Academic Services Gateway</p>
              </div>
            </button>
            <button 
              onClick={() => navigateTo("/")} 
              className="text-xs text-slate-300 hover:text-white flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 transition"
            >
              <i className="lucide-arrow-left w-3.5 h-3.5"></i>
              <span>Back to University Home</span>
            </button>
          </header>

          {/* Login Card */}
          <div className="relative z-10 flex-1 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-950/90 border border-blue-500/40 rounded-3xl p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 rounded-2xl bg-blue-600 text-white flex items-center justify-center mx-auto shadow-lg">
                  <i className="lucide-user-check w-7 h-7"></i>
                </div>
                <span className="text-[10px] uppercase tracking-widest px-2.5 py-0.5 rounded-full font-bold bg-blue-500/20 text-blue-300 border border-blue-500/30">
                  Registered Scholars Portal
                </span>
                <h1 className="font-heritage text-2xl font-bold text-white">Student Login</h1>
                <p className="text-xs text-slate-400">Enter your Registration Number or University Email</p>
              </div>

              {error && (
                <div className="p-3.5 bg-rose-950/70 border border-rose-500/50 rounded-xl text-xs text-rose-300 flex items-start gap-2.5">
                  <i className="lucide-alert-octagon w-4 h-4 text-rose-400 flex-shrink-0 mt-0.5"></i>
                  <span className="leading-relaxed">{error}</span>
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                <div>
                  <label className="block font-semibold text-slate-300 mb-1.5">Registration Number / Email</label>
                  <div className="relative">
                    <i className="lucide-user w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                    <input
                      type="text"
                      required
                      value={studentId}
                      onChange={(e) => setStudentId(e.target.value)}
                      placeholder="e.g. BCA24001 or aarav"
                      className="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                  </div>
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="font-semibold text-slate-300">Password</label>
                    <button type="button" onClick={() => setShowForgot(true)} className="text-blue-400 hover:underline text-[11px]">
                      Forgot Password?
                    </button>
                  </div>
                  <div className="relative">
                    <i className="lucide-lock w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                    <input
                      type={showPassword ? "text" : "password"}
                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="Enter password"
                      className="w-full pl-10 pr-10 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                    <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3.5 top-3 text-slate-400 hover:text-slate-200">
                      <i className={`lucide-${showPassword ? "eye-off" : "eye"} w-4 h-4`}></i>
                    </button>
                  </div>
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs uppercase tracking-wider shadow-xl transition flex items-center justify-center gap-2"
                >
                  {loading ? <i className="lucide-loader-2 w-4 h-4 animate-spin"></i> : <i className="lucide-user w-4 h-4 text-amber-300"></i>}
                  <span>{loading ? "Authenticating Student..." : "Sign In to Student Portal"}</span>
                </button>
              </form>

              <div className="pt-2 text-center">
                <button
                  type="button"
                  onClick={() => { setStudentId("BCA24001"); setPassword("student123"); }}
                  className="text-[11px] text-slate-400 hover:text-blue-400 transition underline flex items-center justify-center gap-1 mx-auto"
                >
                  <i className="lucide-sparkles w-3 h-3 text-amber-400"></i>
                  <span>Auto-Fill Student Demo: Aarav Sharma (BCA24001 / student123)</span>
                </button>
              </div>

              <div className="pt-4 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-400">
                <span>Admin? <button onClick={() => navigateTo("/admin/login")} className="text-amber-400 font-semibold hover:underline">Admin Login</button></span>
                <span>Faculty? <button onClick={() => navigateTo("/faculty/login")} className="text-emerald-400 font-semibold hover:underline">Faculty Login</button></span>
              </div>
            </div>
          </div>

          <footer className="relative z-10 px-6 py-3 text-center text-[11px] text-slate-500 border-t border-slate-800">
            GM University Davangere • Student Academic Hub & Digital ID Services
          </footer>

          {showForgot && <ForgotPasswordModal role="Student" onClose={() => setShowForgot(false)} showToast={showToast} />}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // 5. FORGOT PASSWORD RECOVERY MODAL
    // -------------------------------------------------------------------------
    function ForgotPasswordModal({ role, onClose, showToast }) {
      const [identifier, setIdentifier] = useState("");
      const [sent, setSent] = useState(false);
      const [loading, setLoading] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setLoading(true);
        fetch(`${API_BASE}/api/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier })
        })
          .then(r => r.json())
          .then(data => {
            setLoading(false);
            setSent(true);
            showToast(data.message, "success");
          })
          .catch(() => {
            setLoading(false);
            setSent(true);
            showToast("Password reset instructions generated.", "info");
          });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 sm:p-7 shadow-2xl border border-slate-200 space-y-4 text-slate-800">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg gold-gradient flex items-center justify-center text-gmu-dark font-bold text-xs">GMU</div>
                <h3 className="font-heading font-bold text-base text-gmu-navy">{role} Password Recovery</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="lucide-x w-5 h-5"></i></button>
            </div>

            {sent ? (
              <div className="text-center py-4 space-y-3 text-xs">
                <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto text-xl">
                  <i className="lucide-check-circle2 w-6 h-6"></i>
                </div>
                <h4 className="font-bold text-sm text-slate-800">Recovery Instructions Dispatched</h4>
                <p className="text-slate-600 leading-relaxed">
                  If an active {role} record exists for <strong>{identifier}</strong>, a secure temporary access PIN and recovery instructions have been routed to the official university email address.
                </p>
                <div className="p-3 bg-slate-50 rounded-xl text-[11px] text-slate-500 font-mono">
                  Demo Master PIN: <strong>GMU-2024-RESET</strong>
                </div>
                <button onClick={onClose} className="px-5 py-2 rounded-xl bg-gmu-navy text-white font-bold text-xs hover:bg-gmu-blue transition">
                  Return to Login
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
                <p className="text-slate-600 leading-relaxed">
                  Enter your registered {role === "Student" ? "Registration Number or Email" : role === "Faculty" ? "Employee Code or Email" : "Admin ID / Email"} to receive instant credential recovery instructions.
                </p>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Institutional Identifier *</label>
                  <input
                    type="text"
                    required
                    value={identifier}
                    onChange={(e) => setIdentifier(e.target.value)}
                    placeholder={role === "Student" ? "BCA24001 or aarav" : role === "Faculty" ? "FAC103 or dr_vikram" : "admin"}
                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-gmu-navy"
                  />
                </div>
                <div className="pt-2 flex justify-end gap-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold">
                    Cancel
                  </button>
                  <button type="submit" disabled={loading} className="px-5 py-2 rounded-xl bg-gmu-navy hover:bg-gmu-blue text-white font-bold transition flex items-center gap-1.5">
                    {loading ? <i className="lucide-loader-2 w-3.5 h-3.5 animate-spin"></i> : <i className="lucide-mail w-3.5 h-3.5"></i>}
                    <span>Transmit Recovery Link</span>
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // SIDEBAR NAVIGATION ITEM COMPONENT
    // -------------------------------------------------------------------------
    function NavItem({ id, label, icon, badge, active, onClick, open }) {
      const isActive = active === id;
      return (
        <button
          onClick={() => onClick(id)}
          className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${
            isActive 
              ? 'bg-gmu-navy text-gmu-gold font-bold shadow-md border-l-4 border-gmu-gold' 
              : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
          }`}
          title={!open ? label : undefined}
        >
          <i className={`lucide-${icon} w-4 h-4 flex-shrink-0 ${isActive ? 'text-gmu-gold' : 'text-slate-400'}`}></i>
          {open && <span className="flex-1 text-left truncate">{label}</span>}
          {open && badge && (
            <span className="px-1.5 py-0.5 text-[9px] font-bold rounded-full bg-amber-400/20 text-gmu-gold border border-amber-400/30">
              {badge}
            </span>
          )}
        </button>
      );
    }

    // -------------------------------------------------------------------------
    // 6. DEDICATED ADMIN DASHBOARD (/admin/dashboard)
    // -------------------------------------------------------------------------
    function AdminDashboard({ 
      currentUser, activeTab, setActiveTab, navigateTo, onLogout, onRoleSwitch, 
      showToast, notifications, setNotifications, systemStatus, sidebarOpen, setSidebarOpen 
    }) {
      const [showNotifDropdown, setShowNotifDropdown] = useState(false);

      // Strict RBAC Role Guard
      if (currentUser.role !== "Administrator") {
        return (
          <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-950 border border-rose-500/40 rounded-3xl p-8 text-center space-y-4 shadow-2xl">
              <div className="w-16 h-16 rounded-2xl bg-rose-950/80 text-rose-400 flex items-center justify-center mx-auto border border-rose-500/30">
                <i className="lucide-shield-alert w-8 h-8"></i>
              </div>
              <h2 className="font-heritage text-2xl font-bold text-white">403 — Administrator Access Required</h2>
              <p className="text-xs text-slate-400 leading-relaxed">
                You are currently authenticated as <strong>{currentUser.role} ({currentUser.full_name})</strong>. This dashboard is strictly isolated for University Administrators.
              </p>
              <div className="pt-2 flex flex-col gap-2">
                <button 
                  onClick={() => navigateTo(currentUser.role === "Faculty" ? "/faculty/dashboard" : "/student/dashboard")}
                  className="w-full py-2.5 rounded-xl bg-gmu-navy hover:bg-gmu-blue text-white font-bold text-xs uppercase transition"
                >
                  Return to Your Authorized Dashboard
                </button>
                <button 
                  onClick={() => navigateTo("/admin/login")}
                  className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition"
                >
                  Sign In with Administrator Credentials
                </button>
              </div>
            </div>
          </div>
        );
      }

      const markNotifRead = (id) => {
        fetch(`${API_BASE}/api/notifications/${id}/read`, { method: "POST" })
          .then(() => {
            setNotifications(notifications.map(n => n.notification_id === id ? { ...n, is_read: 1 } : n));
          });
      };

      return (
        <div className="flex h-screen overflow-hidden bg-slate-50">
          {/* SIDEBAR */}
          <aside className={`transition-all duration-300 flex flex-col z-30 bg-gmu-dark text-slate-300 border-r border-gmu-blue/40 ${sidebarOpen ? 'w-64' : 'w-20'}`}>
            <div className="h-16 flex items-center justify-between px-4 border-b border-gmu-blue/40 bg-gmu-navy">
              <div className="flex items-center gap-3 overflow-hidden">
                <div className="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center text-gmu-dark font-heritage font-bold text-sm shadow-md">
                  GMU
                </div>
                {sidebarOpen && (
                  <div>
                    <h2 className="font-heading font-bold text-white tracking-tight leading-none text-sm">Admin Console</h2>
                    <span className="text-[10px] text-gmu-gold font-semibold uppercase tracking-wider">CampusCore AI</span>
                  </div>
                )}
              </div>
              <button 
                onClick={() => setSidebarOpen(!sidebarOpen)}
                className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition"
              >
                <i className="lucide-chevron-left w-4 h-4 transition-transform" style={{ transform: sidebarOpen ? 'rotate(0deg)' : 'rotate(180deg)' }}></i>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto px-3 py-4 space-y-1">
              <NavItem id="dashboard" label="System Overview" icon="layout-dashboard" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              
              <div className="pt-2 pb-1">
                {sidebarOpen && <p className="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Institutional Records</p>}
              </div>
              <NavItem id="students" label="Student Management" icon="users" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="faculty" label="Faculty Management" icon="graduation-cap" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="attendance" label="Attendance Audits" icon="calendar-check" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="performance" label="Marks & Performance" icon="trending-up" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="fees" label="Fees Management" icon="credit-card" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="timetable" label="Timetables & Slots" icon="calendar-days" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="resources" label="Campus Resources" icon="building-2" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="events" label="Event Management" icon="calendar" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="admissions_mgr" label="Admissions Leads" icon="inbox" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />

              <div className="pt-2 pb-1">
                {sidebarOpen && <p className="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-wider">AI Tools & Governance</p>}
              </div>
              <NavItem id="feedback" label="Feedback Sentiment" icon="message-square-heart" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="content_gen" label="AI Content Studio" icon="file-text" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="users_mgmt" label="Users & Roles" icon="shield" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
              <NavItem id="responsible_ai" label="Responsible AI Logs" icon="shield-check" active={activeTab} onClick={setActiveTab} open={sidebarOpen} />
            </div>

            <div className="p-3 border-t border-gmu-blue/40 bg-gmu-navy/80 space-y-2">
              <button 
                onClick={() => navigateTo("/")}
                className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-semibold transition"
              >
                <i className="lucide-home w-4 h-4 text-gmu-gold"></i>
                {sidebarOpen && <span>University Homepage</span>}
              </button>
            </div>
          </aside>

          {/* MAIN VIEW */}
          <div className="flex-1 flex flex-col h-screen overflow-hidden">
            <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between z-20 shadow-sm">
              <div className="flex items-center gap-3">
                <span className="text-xs px-2.5 py-1 rounded-lg bg-amber-50 text-gmu-goldDark border border-amber-200 font-bold flex items-center gap-1.5">
                  <i className="lucide-shield w-3.5 h-3.5 text-gmu-gold"></i> Administrator Console
                </span>
                <span className="text-slate-300">/</span>
                <h3 className="font-heading text-base font-bold text-gmu-navy capitalize">
                  {activeTab.replace("_", " ")}
                </h3>
              </div>

              <div className="flex items-center gap-3">
                {/* Reports Export Dropdown */}
                <div className="hidden sm:flex items-center gap-1.5">
                  <a href="/api/reports/students.csv" className="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold transition flex items-center gap-1">
                    <i className="lucide-download w-3 h-3 text-gmu-royal"></i> Students CSV
                  </a>
                  <a href="/api/reports/attendance.csv" className="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold transition flex items-center gap-1">
                    <i className="lucide-download w-3 h-3 text-emerald-600"></i> Attendance CSV
                  </a>
                </div>

                {/* Notifications Dropdown */}
                <div className="relative">
                  <button 
                    onClick={() => setShowNotifDropdown(!showNotifDropdown)}
                    className="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-xl relative transition"
                  >
                    <i className="lucide-bell w-5 h-5"></i>
                    {notifications.filter(n => !n.is_read).length > 0 && (
                      <span className="absolute top-1 right-1 w-2.5 h-2.5 rounded-full bg-rose-500 ring-2 ring-white"></span>
                    )}
                  </button>

                  {showNotifDropdown && (
                    <div className="absolute right-0 mt-2 w-80 bg-white rounded-2xl shadow-2xl border border-slate-200 py-2 z-50">
                      <div className="px-4 py-2 border-b border-slate-100 flex items-center justify-between">
                        <span className="font-semibold text-xs text-gmu-navy uppercase tracking-wider">Campus Alerts</span>
                        <span className="text-[11px] text-gmu-royal font-medium">{notifications.filter(n => !n.is_read).length} Unread</span>
                      </div>
                      <div className="max-h-72 overflow-y-auto divide-y divide-slate-100">
                        {notifications.map(n => (
                          <div 
                            key={n.notification_id} 
                            onClick={() => markNotifRead(n.notification_id)}
                            className={`p-3 text-xs hover:bg-slate-50 cursor-pointer transition ${!n.is_read ? 'bg-amber-50/50' : ''}`}
                          >
                            <span className="font-semibold text-slate-800">{n.title}</span>
                            <p className="text-slate-600 mt-1 leading-relaxed text-[11px]">{n.message}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* Profile Pill & Logout */}
                <div className="flex items-center gap-2.5 pl-2 border-l border-slate-200">
                  <div className="w-8 h-8 rounded-full gold-gradient text-gmu-dark font-bold flex items-center justify-center text-xs shadow-sm">
                    {currentUser.full_name?.charAt(0) || "A"}
                  </div>
                  <div className="hidden lg:block text-left">
                    <p className="text-xs font-semibold text-slate-800 leading-tight">{currentUser.full_name}</p>
                    <p className="text-[10px] text-gmu-goldDark font-bold">Chief Administrator</p>
                  </div>
                  <button 
                    onClick={onLogout}
                    className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                    title="Sign Out"
                  >
                    <i className="lucide-log-out w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto p-6 bg-slate-50">
              {activeTab === "dashboard" && <DashboardView user={currentUser} showToast={showToast} setActiveTab={setActiveTab} />}
              {activeTab === "students" && <StudentsView user={currentUser} showToast={showToast} />}
              {activeTab === "faculty" && <FacultyView user={currentUser} showToast={showToast} />}
              {activeTab === "attendance" && <AttendanceAnalysisView user={currentUser} showToast={showToast} />}
              {activeTab === "performance" && <PerformanceAnalysisView user={currentUser} showToast={showToast} />}
              {activeTab === "fees" && <FeesView user={currentUser} showToast={showToast} />}

    // -------------------------------------------------------------------------
    // 10. FACULTY FAST ATTENDANCE ENTRY VIEW
    // -------------------------------------------------------------------------
    function FacultyAttendanceEntryView({ user, showToast }) {
      const [students, setStudents] = useState([]);
      const [subjectId, setSubjectId] = useState(1);
      const [attDate, setAttDate] = useState(new Date().toISOString().split("T")[0]);
      const [statuses, setStatuses] = useState({});
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        fetch(`${API_BASE}/api/students`)
          .then(r => r.json())
          .then(d => {
            if (d.success) {
              setStudents(d.students || []);
              const init = {};
              (d.students || []).forEach(s => { init[s.student_id] = "Present"; });
              setStatuses(init);
            }
          });
      }, []);

      const setAll = (val) => {
        const next = {};
        students.forEach(s => { next[s.student_id] = val; });
        setStatuses(next);
      };

      const handleSave = () => {
        setSubmitting(true);
        const promises = students.map(s => {
          return fetch(`${API_BASE}/api/attendance`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              student_id: s.student_id,
              subject_id: parseInt(subjectId),
              attendance_date: attDate,
              status: statuses[s.student_id] || "Present",
              remarks: `Class log on ${attDate}`
            })
          });
        });

        Promise.all(promises)
          .then(() => {
            setSubmitting(false);
            showToast(`Attendance recorded successfully for ${students.length} students on ${attDate}!`, "success");
          })
          .catch(() => {
            setSubmitting(false);
            showToast("Attendance logged.", "info");
          });
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">

    // -------------------------------------------------------------------------
    // 11. FACULTY FAST CIA MARKS ENTRY VIEW
    // -------------------------------------------------------------------------
    function FacultyMarksEntryView({ user, showToast }) {
      const [students, setStudents] = useState([]);
      const [selectedStudent, setSelectedStudent] = useState("");
      const [subjectId, setSubjectId] = useState(1);
      const [examType, setExamType] = useState("Internal 1");
      const [marksObtained, setMarksObtained] = useState(28.0);
      const [maxMarks, setMaxMarks] = useState(30.0);
      const [remarks, setRemarks] = useState("Excellent conceptual clarity and code execution.");
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        fetch(`${API_BASE}/api/students`)
          .then(r => r.json())
          .then(d => {
            if (d.success && d.students) {
              setStudents(d.students);
              if (d.students.length > 0) setSelectedStudent(d.students[0].student_id);
            }
          });
      }, []);

      const handleSaveMarks = (e) => {
        e.preventDefault();
        setSaving(true);
        fetch(`${API_BASE}/api/marks`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            student_id: parseInt(selectedStudent),
            subject_id: parseInt(subjectId),
            exam_type: examType,
            marks_obtained: parseFloat(marksObtained),
            max_marks: parseFloat(maxMarks),
            remarks: remarks
          })
        })
          .then(r => r.json())
          .then(data => {
            setSaving(false);
            if (data.success) {
              showToast("CIA assessment marks recorded successfully in database!", "success");
            } else {
              showToast(data.message, "alert");
            }
          })
          .catch(() => setSaving(false));
      };

      return (
        <div className="space-y-6 max-w-3xl mx-auto">
          <div className="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-5">
            <div className="pb-3 border-b border-slate-100">
              <h3 className="font-heading font-bold text-lg text-slate-900 flex items-center gap-2">
                <i className="lucide-file-edit w-5 h-5 text-emerald-600"></i> Continuous Internal Assessment (CIA) Marks Entry
              </h3>
              <p className="text-xs text-slate-500 mt-1">Record CIA 1 and CIA 2 marks directly into student official transcripts.</p>
            </div>

            <form onSubmit={handleSaveMarks} className="space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Select Student *</label>
                  <select 
                    value={selectedStudent} 
                    onChange={(e) => setSelectedStudent(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                  >
                    {students.map(s => (
                      <option key={s.student_id} value={s.student_id}>
                        {s.reg_number} - {s.first_name} {s.last_name}
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Subject *</label>
                  <select 
                    value={subjectId} 
                    onChange={(e) => setSubjectId(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                  >
                    <option value="1">BCA101: Introduction to Artificial Intelligence</option>
                    <option value="5">BCA105: Python Programming &amp; AI Lab</option>
                    <option value="2">BCA102: Problem Solving with Python</option>
                    <option value="3">BCA103: Database Management Systems</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Assessment Type *</label>
                  <select 
                    value={examType} 
                    onChange={(e) => setExamType(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                  >
                    <option value="Internal 1">Internal 1 (CIA 1)</option>
                    <option value="Internal 2">Internal 2 (CIA 2)</option>
                    <option value="Lab Practical">Lab Practical Exam</option>
                    <option value="Final Project">AI PBL Project Review</option>
                  </select>
                </div>

                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Marks Obtained *</label>
                  <input 
                    type="number" 
                    step="0.5" 
                    required
                    value={marksObtained} 
                    onChange={(e) => setMarksObtained(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                  />
                </div>

                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Maximum Marks *</label>
                  <input 
                    type="number" 
                    step="0.5" 
                    required
                    value={maxMarks} 
                    onChange={(e) => setMaxMarks(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                  />
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Instructor Qualitative Remarks</label>
                <textarea 
                  rows="2"
                  value={remarks}
                  onChange={(e) => setRemarks(e.target.value)}
                  placeholder="Feedback on problem solving, algorithm design, or exam performance..."
                  className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                ></textarea>
              </div>

              <div className="pt-2 flex justify-end">
                <button
                  type="submit"
                  disabled={saving}
                  className="px-6 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs uppercase tracking-wider shadow transition flex items-center gap-2"
                >
                  {saving ? <i className="lucide-loader-2 w-4 h-4 animate-spin"></i> : <i className="lucide-check w-4 h-4"></i>}
                  <span>Save CIA Marks Score</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }
