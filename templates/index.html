    // -------------------------------------------------------------------------
    // 13. FEES MANAGEMENT VIEW (STUDENT & ADMIN)
    // -------------------------------------------------------------------------
    function FeesView({ user, showToast }) {
      const [feeRecords, setFeeRecords] = useState([]);
      const [loading, setLoading] = useState(true);
      const [payModal, setPayModal] = useState(null);
      const [payAmount, setPayAmount] = useState(10000);
      const [payMode, setPayMode] = useState("UPI Reference");
      const [submittingPayment, setSubmittingPayment] = useState(false);

      const loadFees = () => {
        setLoading(true);
        fetch(`${API_BASE}/api/fees`)
          .then(r => r.json())
          .then(d => {
            setLoading(false);
            if (d.success) setFeeRecords(d.records || []);
          })
          .catch(() => setLoading(false));
      };

      useEffect(() => {
        loadFees();
      }, []);

      const handlePay = (e) => {
        e.preventDefault();
        setSubmittingPayment(true);
        fetch(`${API_BASE}/api/fees/pay`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fee_record_id: payModal.fee_record_id,
            amount_paid: parseFloat(payAmount),
            payment_mode: payMode,
            transaction_ref: `UPI/GMU/${Math.floor(100000 + Math.random() * 900000)}`
          })
        })
          .then(r => r.json())
          .then(data => {
            setSubmittingPayment(false);
            if (data.success) {
              showToast(data.message, "success");
              setPayModal(null);
              loadFees();
            } else {
              showToast(data.message, "alert");
            }
          })
          .catch(() => setSubmittingPayment(false));
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Header Card */}
          <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <h3 className="font-heading font-bold text-base text-slate-900 flex items-center gap-2">
                <i className="lucide-credit-card w-5 h-5 text-gmu-royal"></i> University Fees &amp; Financial Ledger
              </h3>
              <p className="text-xs text-slate-500 mt-0.5">
                {user.role === "Student" 
                  ? "View tuition dues, payment breakdown, and pay online with instant receipt generation." 
                  : "Track university collections, fee clearances, and outstanding balances."}
              </p>
            </div>
            <button onClick={loadFees} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition flex items-center gap-1.5">
              <i className="lucide-refresh-cw w-3.5 h-3.5"></i> Refresh Ledger
            </button>
          </div>

          {/* Records Table */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-4 bg-slate-50 border-b border-slate-200 font-bold text-xs text-slate-700">
              Fee Invoices &amp; Clearances
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left">
                <thead className="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold">
                  <tr>
                    <th className="p-3.5">Record ID</th>
                    <th className="p-3.5">Student</th>
                    <th className="p-3.5">Fee Type</th>
                    <th className="p-3.5">Amount Due</th>
                    <th className="p-3.5">Paid</th>
                    <th className="p-3.5">Balance</th>
                    <th className="p-3.5">Status</th>
                    <th className="p-3.5 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {feeRecords.map(r => (
                    <tr key={r.fee_record_id} className="hover:bg-slate-50">
                      <td className="p-3.5 font-mono text-slate-500">#{r.fee_record_id}</td>
                      <td className="p-3.5 font-bold text-slate-800">
                        {r.first_name} {r.last_name}
                        <span className="block text-[11px] text-slate-400 font-mono font-normal">{r.reg_number}</span>
                      </td>
                      <td className="p-3.5 text-slate-600">{r.fee_type}</td>
                      <td className="p-3.5 font-semibold text-slate-800">₹{r.amount_due?.toLocaleString()}</td>
                      <td className="p-3.5 font-semibold text-emerald-600">₹{r.total_paid?.toLocaleString()}</td>
                      <td className="p-3.5 font-semibold text-rose-600">₹{r.balance_due?.toLocaleString()}</td>
                      <td className="p-3.5">
                        <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                          r.status === "Paid" ? "bg-emerald-100 text-emerald-800" :
                          r.status === "Partially Paid" ? "bg-amber-100 text-amber-800" : "bg-rose-100 text-rose-800"
                        }`}>
                          {r.status}
                        </span>
                      </td>
                      <td className="p-3.5 text-right">
                        {r.balance_due > 0 ? (
                          <button
                            onClick={() => { setPayModal(r); setPayAmount(r.balance_due); }}
                            className="px-3 py-1 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs shadow transition"
                          >
                            Pay Dues
                          </button>
                        ) : (
                          <span className="text-[11px] text-emerald-600 font-bold flex items-center justify-end gap-1">
                            <i className="lucide-check-circle w-3.5 h-3.5"></i> Cleared
                          </span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* PAYMENT MODAL */}
          {payModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200 text-slate-800 text-xs">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="font-heading font-bold text-base text-gmu-navy">Process Fee Payment</h3>
                  <button onClick={() => setPayModal(null)} className="text-slate-400 hover:text-slate-600">
                    <i className="lucide-x w-5 h-5"></i>
                  </button>
                </div>

                <div className="p-3 bg-slate-50 rounded-xl space-y-1">
                  <p className="font-bold text-slate-800">{payModal.first_name} {payModal.last_name} ({payModal.reg_number})</p>
                  <p className="text-slate-500">{payModal.fee_type} • Total Balance: ₹{payModal.balance_due?.toLocaleString()}</p>
                </div>

                <form onSubmit={handlePay} className="space-y-3.5">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Payment Amount (₹) *</label>
                    <input 
                      type="number"
                      max={payModal.balance_due}
                      min="100"
                      required
                      value={payAmount}
                      onChange={(e) => setPayAmount(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Payment Mode *</label>
                    <select 
                      value={payMode} 
                      onChange={(e) => setPayMode(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                    >
                      <option value="UPI Reference">UPI / QR Code Checkout</option>
                      <option value="Net Banking">Net Banking / NEFT</option>
                      <option value="Debit Card">Debit / Credit Card</option>
                      <option value="Demand Draft">Demand Draft (Bank Counter)</option>
                    </select>
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setPayModal(null)} className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold">
                      Cancel
                    </button>
                    <button type="submit" disabled={submittingPayment} className="px-5 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white font-bold transition flex items-center gap-1.5">
                      {submittingPayment ? <i className="lucide-loader-2 w-3.5 h-3.5 animate-spin"></i> : <i className="lucide-check w-3.5 h-3.5"></i>}
                      <span>Pay ₹{payAmount?.toLocaleString()} &amp; Generate Receipt</span>
                    </button>
                  </div>

    // -------------------------------------------------------------------------

    // -------------------------------------------------------------------------
    function UserManagementView({ user, showToast }) {
      const [usersList, setUsersList] = useState([]);
      const [loading, setLoading] = useState(true);

      const loadUsers = () => {
        setLoading(true);
        fetch(`${API_BASE}/api/users`)
          .then(r => r.json())
          .then(d => {
            setLoading(false);
            if (d.success) setUsersList(d.users || []);
          })
          .catch(() => setLoading(false));
      };

      useEffect(() => {
        loadUsers();
      }, []);

      const toggleStatus = (userId, currentStatus) => {
        const newStatus = currentStatus === 1 ? 0 : 1;
        fetch(`${API_BASE}/api/users/${userId}/status`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ is_active: newStatus })
        })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              showToast("User account status updated.", "success");
              loadUsers();
            }
          });
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex items-center justify-between">
            <div>
              <h3 className="font-heading font-bold text-base text-slate-900 flex items-center gap-2">
                <i className="lucide-shield w-5 h-5 text-gmu-gold"></i> Institutional User Accounts &amp; RBAC Control
              </h3>
              <p className="text-xs text-slate-500 mt-0.5">Manage user access rights, security credentials, and active account flags.</p>
            </div>
            <button onClick={loadUsers} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold">

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <table className="w-full text-xs text-left">
              <thead className="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold">
                <tr>
                  <th className="p-3.5">User ID</th>
                  <th className="p-3.5">Username</th>
                  <th className="p-3.5">Full Name</th>
                  <th className="p-3.5">Email</th>
                  <th className="p-3.5">Assigned Role</th>
                  <th className="p-3.5">Account Status</th>
                  <th className="p-3.5 text-right">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {usersList.map(u => (
                  <tr key={u.user_id} className="hover:bg-slate-50">
                    <td className="p-3.5 font-mono text-slate-500">#{u.user_id}</td>
                    <td className="p-3.5 font-bold text-slate-800">{u.username}</td>
                    <td className="p-3.5 text-slate-700">{u.full_name || "—"}</td>
                    <td className="p-3.5 text-slate-500">{u.email}</td>
                    <td className="p-3.5">
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                        u.role === "Administrator" ? "bg-amber-100 text-amber-800" :
                        u.role === "Faculty" ? "bg-emerald-100 text-emerald-800" : "bg-blue-100 text-blue-800"
                      }`}>
                        {u.role}
                      </span>
                    </td>
                    <td className="p-3.5">
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${u.is_active === 1 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                        {u.is_active === 1 ? "Active" : "Suspended"}
                      </span>
                    </td>
                    <td className="p-3.5 text-right">
                      <button
                        onClick={() => toggleStatus(u.user_id, u.is_active)}
                        className="px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold"
                      >
                        {u.is_active === 1 ? "Suspend" : "Activate"}
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }
    function DashboardView({ user, showToast, setActiveTab }) {
      const [stats, setStats] = useState(null);
      const [charts, setCharts] = useState(null);
      const [loading, setLoading] = useState(true);
      const chartRef1 = useRef(null);
      const chartRef2 = useRef(null);

      useEffect(() => {
        Promise.all([
          fetch(`${API_BASE}/api/dashboard/stats`).then(r => r.json()),
          fetch(`${API_BASE}/api/dashboard/charts`).then(r => r.json())
        ]).then(([sData, cData]) => {
          if (sData.success) setStats(sData.stats);
          if (cData.success) setCharts(cData.charts);
          setLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!charts) return;
        let c1, c2;
        if (chartRef1.current) {
          const ctx1 = chartRef1.current.getContext('2d');
          c1 = new Chart(ctx1, {
            type: 'doughnut',
            data: {
              labels: charts.department_students.map(d => d.department),
              datasets: [{
                data: charts.department_students.map(d => d.student_count),
                backgroundColor: ['#002B49', '#D4AF37', '#1E40AF', '#10B981']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom' } }
            }
          });
        }

        if (chartRef2.current) {
          const ctx2 = chartRef2.current.getContext('2d');
          c2 = new Chart(ctx2, {
            type: 'bar',
            data: {
              labels: charts.subject_scores.map(s => s.subject),
              datasets: [{
                label: 'Class CIA Average (%)',
                data: charts.subject_scores.map(s => s.avg_score),
                backgroundColor: '#002B49',
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: { y: { min: 0, max: 100 } }
            }
          });
        }

        return () => {
          if (c1) c1.destroy();
          if (c2) c2.destroy();

      return (
        <div className="space-y-6">
          {/* Welcome Banner */}
          <div className="rounded-2xl navy-gradient p-6 text-white shadow-xl border-l-4 border-gmu-gold relative overflow-hidden">
            <div className="relative z-10 max-w-2xl space-y-2">
              <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold gold-gradient text-gmu-dark shadow-sm">
                <i className="lucide-sparkles w-3.5 h-3.5"></i> GM Smart University • Active Role: {user.role}
              </span>
              <h2 className="font-heritage text-2xl sm:text-3xl font-bold tracking-tight text-white">
                Welcome, {user.full_name}
              </h2>
              <p className="text-slate-200 text-xs sm:text-sm leading-relaxed">
                Smart Campus Management Ecosystem integrating AI Chatbots, Pedagogical Study Notes, Performance Diagnosis, Attendance Shortage Analytics, and Responsible AI Governance.
              </p>
              <div className="pt-3 flex flex-wrap gap-2.5">
                <button 
                  onClick={() => setActiveTab("chatbot")}
                  className="px-4 py-2 rounded-xl gold-gradient text-gmu-dark font-bold text-xs hover:brightness-110 shadow-md transition flex items-center gap-1.5"
                >
                  <i className="lucide-bot w-4 h-4"></i> Ask AI Campus Chatbot
                </button>
                <button 
                  onClick={() => setActiveTab("academic")}
                  className="px-4 py-2 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl text-xs backdrop-blur-md border border-white/20 transition flex items-center gap-1.5"
                >
                  <i className="lucide-sparkles w-4 h-4 text-gmu-gold"></i> AI Study Notes
                </button>
                <a 
                  href="/api/reports/students.csv"
                  className="px-4 py-2 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl text-xs backdrop-blur-md border border-white/20 transition flex items-center gap-1.5"
                >
                  <i className="lucide-download w-4 h-4"></i> Export Student CSV
                </a>
              </div>
            </div>
            <div className="absolute -right-10 -bottom-10 w-64 h-64 bg-gmu-gold/10 rounded-full blur-3xl pointer-events-none"></div>
          </div>

          {/* Metric Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <MetricCard 
              title="Enrolled Students" 
              value={stats.total_students} 
              subtext="Undergraduate & Postgraduate"
              icon="users"
              color="navy"
              onClick={() => setActiveTab("students")}
            />
            <MetricCard 
              title="Average Attendance" 
              value={`${stats.average_attendance}%`} 
              subtext={`${stats.attendance_shortage_count} students with < 75% shortage`}
              icon="calendar-check"
              color={stats.average_attendance >= 75 ? "emerald" : "amber"}
              onClick={() => setActiveTab("attendance")}
            />
            <MetricCard 
              title="Faculty Mentors" 
              value={stats.total_faculty} 
              subtext="Academic Leaders & HODs"
              icon="graduation-cap"
              color="gold"
              onClick={() => setActiveTab("faculty")}
            />
            <MetricCard 
              title="Upcoming Campus Events" 
              value={stats.upcoming_events} 
              subtext="Hackathons & Seminars"
              icon="calendar"
              color="navy"
              onClick={() => setActiveTab("events")}
            />
          </div>

          {/* Charts Section */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="glass-card rounded-2xl p-5 shadow-sm border border-slate-200">
              <h3 className="font-heading font-bold text-sm text-gmu-navy flex items-center gap-2 mb-4">
                <i className="lucide-pie-chart w-4 h-4 text-gmu-gold"></i> Department Enrollment Ratios
              </h3>
              <div className="h-64 relative">
                <canvas ref={chartRef1}></canvas>

            <div className="lg:col-span-2 glass-card rounded-2xl p-5 shadow-sm border border-slate-200">
              <h3 className="font-heading font-bold text-sm text-gmu-navy flex items-center gap-2 mb-4">
                <i className="lucide-bar-chart-3 w-4 h-4 text-gmu-gold"></i> Continuous Assessment (CIA) Average Benchmarks

              <div className="h-64 relative">
                <canvas ref={chartRef2}></canvas>
              </div>
            </div>
          </div>

    function MetricCard({ title, value, subtext, icon, color, onClick }) {
      const colorMap = {
        navy: "bg-gmu-navy text-white border-gmu-navy",
        gold: "bg-amber-50 text-gmu-goldDark border-amber-200",
        emerald: "bg-emerald-50 text-emerald-800 border-emerald-200",
        amber: "bg-rose-50 text-rose-800 border-rose-200"
      };

      return (
        <div 
          onClick={onClick}
          className="glass-card rounded-2xl p-5 shadow-sm hover:shadow-md transition cursor-pointer border border-slate-200/90 group"
        >
          <div className="flex items-center justify-between">
            <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">{title}</span>
            <div className={`w-9 h-9 rounded-xl flex items-center justify-center border ${colorMap[color] || colorMap.navy}`}>
              <i className={`lucide-${icon} w-5 h-5`}></i>
            </div>
          </div>
          <div className="mt-2 flex items-baseline gap-2">
            <span className="font-heading text-2xl font-bold text-gmu-navy">{value}</span>
          </div>
          <p className="mt-1 text-xs text-slate-500">{subtext}</p>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // AI CHATBOT VIEW COMPONENT
    // -------------------------------------------------------------------------
    function ChatbotView({ user, showToast }) {
      const [messages, setMessages] = useState([
        {
          sender: "ai",
          text: `Welcome to GM Smart University! I am your AI Campus Assistant. Ask me about BCA & MCA courses, faculty offices, the 75% attendance rule, the Ada Lovelace GPU Lab, or upcoming hackathons.`,
          engine: "GMU Knowledge Graph"
        }
      ]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); };
      useEffect(() => { scrollToBottom(); }, [messages, loading]);

      const handleSend = (textToSend) => {
        const queryText = textToSend || input;
        if (!queryText.trim()) return;

        const newMessages = [...messages, { sender: "user", text: queryText }];
        setMessages(newMessages);
        if (!textToSend) setInput("");
        setLoading(true);

        fetch(`${API_BASE}/api/ai/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: queryText })
        })
          .then(res => res.json())
          .then(data => {
            setLoading(false);
            if (data.success) {
              setMessages([
                ...newMessages,
                { sender: "ai", text: data.data.answer, engine: data.data.engine, pii_detected: data.data.pii_detected }
              ]);
            }
          })
          .catch(() => setLoading(false));
      };

      const promptPills = [
        "What are the BCA course subjects?",
        "Explain the 75% attendance policy",
        "Who is Dr. Vikram Malhotra?",
        "Ada Lovelace AI Lab details",
        "Upcoming Hackathons"
      ];

      return (
        <div className="h-[calc(100vh-140px)] flex flex-col glass-card rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="px-6 py-3.5 bg-gmu-navy text-white flex items-center justify-between border-b border-gmu-blue">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center text-gmu-dark font-bold">
                <i className="lucide-bot w-5 h-5"></i>
              </div>
              <div>
                <h3 className="font-heading font-bold text-sm text-white">GMU AI Campus Counselor</h3>
                <span className="text-[10px] text-gmu-gold flex items-center gap-1 font-medium">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Dual-Engine Active (Gemini + Local NLP)
                </span>
              </div>
            </div>
            <span className="text-[11px] px-2.5 py-1 rounded-full bg-gmu-dark text-slate-300 border border-slate-700">
              Responsible AI Filter Active
            </span>
          </div>

          <div className="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50">
            {messages.map((m, idx) => (
              <div key={idx} className={`flex ${m.sender === "user" ? "justify-end" : "justify-start"}`}>
                <div className={`max-w-2xl rounded-2xl p-4 shadow-sm text-xs sm:text-sm leading-relaxed ${
                  m.sender === "user" 
                    ? "bg-gmu-navy text-white rounded-br-none" 
                    : "bg-white text-slate-800 border border-slate-200 rounded-bl-none"
                }`}>
                  {m.sender === "ai" && (
                    <div className="flex items-center justify-between pb-1.5 mb-2 border-b border-slate-100 text-[10px] text-slate-400">
                      <span className="font-semibold text-gmu-gold flex items-center gap-1">
                        <i className="lucide-sparkles w-3 h-3"></i> {m.engine || "AI Model"}
                      </span>
                      {m.pii_detected && (
                        <span className="text-amber-600 font-semibold bg-amber-50 px-2 py-0.5 rounded">
                          PII Redacted
                        </span>
                      )}
                    </div>
                  )}
                  <div className="whitespace-pre-wrap">{m.text}</div>
                </div>
              </div>
            ))}
            {loading && (
              <div className="flex justify-start">
                <div className="bg-white border border-slate-200 rounded-2xl rounded-bl-none p-3 shadow-sm flex items-center gap-2 text-slate-500 text-xs">
                  <span className="w-2 h-2 rounded-full bg-gmu-navy animate-bounce"></span>
                  <span className="w-2 h-2 rounded-full bg-gmu-navy animate-bounce" style={{ animationDelay: '0.2s' }}></span>
                  <span className="w-2 h-2 rounded-full bg-gmu-navy animate-bounce" style={{ animationDelay: '0.4s' }}></span>
                  <span>Synthesizing university knowledge...</span>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          <div className="px-6 py-2 bg-white border-t border-slate-100 flex items-center gap-2 overflow-x-auto text-xs">
            <span className="text-slate-400 font-medium flex-shrink-0">Sample Queries:</span>
            {promptPills.map((pill, i) => (
              <button 
                key={i} 
                onClick={() => handleSend(pill)}
                className="px-3 py-1 bg-slate-100 hover:bg-amber-50 hover:text-gmu-goldDark text-slate-600 rounded-full flex-shrink-0 transition text-xs border border-slate-200"
              >
                {pill}
              </button>
            ))}
          </div>

          <div className="p-4 bg-white border-t border-slate-200 flex items-center gap-3">
            <input 
              type="text" 
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && handleSend()}
              placeholder="Ask anything about courses, faculty mentors, attendance rules, labs..." 
              className="flex-1 px-4 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-gmu-navy"
            />
            <button 
              onClick={() => handleSend()}
              disabled={loading || !input.trim()}
              className="px-5 py-2.5 bg-gmu-navy hover:bg-gmu-blue disabled:opacity-50 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center gap-1.5"
            >
              <span>Ask AI</span>
              <i className="lucide-send w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // ACADEMIC ASSISTANCE VIEW (Study Notes, Quiz, Summaries)
    // -------------------------------------------------------------------------
    function AcademicAssistanceView({ user, showToast }) {
      const [taskType, setTaskType] = useState("notes");
      const [topic, setTopic] = useState("State Space Search and Heuristic Admissibility in AI");
      const [difficulty, setDifficulty] = useState("Intermediate");
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);

      const handleGenerate = () => {
        if (!topic.trim()) return;
        setLoading(true);
        setResult(null);

        fetch(`${API_BASE}/api/ai/academic-assist`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task_type: taskType, topic, difficulty })
        })
          .then(res => res.json())
          .then(data => {
            setLoading(false);
            if (data.success) {
              setResult(data.result);
              showToast("Pedagogical content synthesized!", "success");
            }
          })
          .catch(() => setLoading(false));
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          <div className="glass-card rounded-2xl p-6 shadow-sm border border-slate-200">
            <h3 className="font-heading font-bold text-base text-gmu-navy flex items-center gap-2">
              <i className="lucide-sparkles w-5 h-5 text-gmu-gold"></i> AI Academic Assistance & Study Synthesizer
            </h3>
            <p className="text-xs text-slate-500 mt-1">Generate comprehensive study notes, 5-question quizzes, and viva exam preparation.</p>

            <div className="mt-4 grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
              <div className="md:col-span-2">
                <label className="block font-semibold text-slate-700 mb-1">Academic Topic or Unit</label>
                <input 
                  type="text" 
                  value={topic}
                  onChange={(e) => setTopic(e.target.value)}
                  placeholder="e.g. Heuristic Search Algorithms, Relational 3NF, Python Loops"
                  className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                />
              </div>

              <div>

                  value={taskType}

                  <option value="quiz">5-Question Concept Quiz</option>

              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Difficulty Level</label>
                <select 
                  value={difficulty}
                  onChange={(e) => setDifficulty(e.target.value)}
                  className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                >
                  <option value="Foundational">Foundational (Sem 1 Intro)</option>
                  <option value="Intermediate">Intermediate (BCA Core)</option>

              <button

              >
                {loading ? <i className="lucide-loader-2 w-4 h-4 animate-spin"></i> : <i className="lucide-sparkles w-4 h-4 text-gmu-gold"></i>}
                <span>{loading ? "Synthesizing Content..." : "Generate Academic Content"}</span>

          {result && (
            <div className="glass-card rounded-2xl p-6 shadow-sm border border-slate-200 bg-white space-y-3">

                <span className="text-xs font-bold text-gmu-navy uppercase tracking-wider flex items-center gap-1.5">
                  <i className="lucide-check-circle w-4 h-4 text-emerald-600"></i> Generated Output ({result.engine})
                </span>
                <button 
                  onClick={() => { navigator.clipboard.writeText(result.content); showToast("Copied to clipboard!", "info"); }}
                  className="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition flex items-center gap-1"
                >
                  <i className="lucide-copy w-3.5 h-3.5"></i> Copy Text
                </button>
              </div>
              <div className="whitespace-pre-wrap font-sans text-xs text-slate-800 leading-relaxed bg-slate-50 p-5 rounded-xl border border-slate-200">
                {result.content}
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // PERFORMANCE ANALYSIS VIEW
    // -------------------------------------------------------------------------
    function PerformanceAnalysisView({ user, showToast }) {
      const [students, setStudents] = useState([]);
      const [selectedId, setSelectedId] = useState(1);
      const [analysis, setAnalysis] = useState(null);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        fetch(`${API_BASE}/api/students`)
          .then(r => r.json())
          .then(data => {
            if (data.success && data.students.length > 0) {
              setStudents(data.students);
              setSelectedId(data.students[0].student_id);
            }
          });
      }, []);

      useEffect(() => {
        if (!selectedId) return;
        setLoading(true);
        fetch(`${API_BASE}/api/marks/student/${selectedId}`)
          .then(r => r.json())
          .then(data => {
            setLoading(false);
            if (data.success) setAnalysis(data.analysis);
          })
          .catch(() => setLoading(false));
      }, [selectedId]);

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          <div className="glass-card rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h3 className="font-heading font-bold text-base text-gmu-navy flex items-center gap-2">
                <i className="lucide-trending-up w-5 h-5 text-gmu-gold"></i> Continuous Internal Assessment (CIA) & Performance Diagnostics
              </h3>
              <p className="text-xs text-slate-500 mt-0.5">Automated calculation of marks aggregate, CGPA, and individualized improvement advice.</p>
            </div>
            <div className="flex items-center gap-2">
              <label className="text-xs font-semibold text-slate-700">Select Student:</label>
              <select 
                value={selectedId}
                onChange={(e) => setSelectedId(Number(e.target.value))}
                className="px-3.5 py-1.5 bg-slate-100 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none"
              >
                {students.map(s => (
                  <option key={s.student_id} value={s.student_id}>
                    {s.reg_number} — {s.first_name} {s.last_name}
                  </option>
                ))}
              </select>
            </div>
          </div>

          {analysis && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="glass-card rounded-2xl p-6 shadow-sm border border-slate-200 text-center flex flex-col items-center justify-center">
                <div className="w-20 h-20 rounded-full bg-slate-50 border-4 border-gmu-navy flex items-center justify-center font-heading text-2xl font-bold text-gmu-navy shadow-inner">
                  {analysis.percentage}%
                </div>
                <h4 className="font-heading font-bold text-base text-gmu-navy mt-3">{analysis.student_name}</h4>
                <p className="text-xs text-slate-400">{analysis.reg_number}</p>
                
                <span className={`mt-3 px-3 py-1 rounded-full text-xs font-semibold ${
                  analysis.badge_color === 'success' ? 'bg-emerald-100 text-emerald-800' :
                  analysis.badge_color === 'alert' ? 'bg-rose-100 text-rose-800' : 'bg-indigo-100 text-indigo-800'
                }`}>
                  {analysis.tier}
                </span>

                <div className="mt-4 pt-4 border-t border-slate-100 w-full flex justify-around text-xs text-slate-600">
                  <div>
                    <span className="block font-bold text-slate-900">{analysis.total_obtained} / {analysis.total_max}</span>
                    <span>Total CIA</span>
                  </div>
                  <div>
                    <span className="block font-bold text-slate-900">{analysis.cgpa}</span>
                    <span>CGPA</span>
                  </div>
                </div>
              </div>

              <div className="md:col-span-2 glass-card rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                <div>
                  <h4 className="font-heading font-semibold text-xs uppercase tracking-wider text-emerald-700 flex items-center gap-1.5 mb-2">
                    <i className="lucide-check-circle2 w-4 h-4"></i> Identified Subject Strengths
                  </h4>
                  <ul className="space-y-1.5 text-xs text-slate-700">
                    {analysis.strengths.map((s, i) => (
                      <li key={i} className="flex items-center gap-2 bg-emerald-50/60 p-2 rounded-lg border border-emerald-100">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> {s}
                      </li>
                    ))}
                  </ul>
                </div>

                <div>
                  <h4 className="font-heading font-semibold text-xs uppercase tracking-wider text-rose-700 flex items-center gap-1.5 mb-2">
                    <i className="lucide-alert-triangle w-4 h-4"></i> Subjects Needing Revision
                  </h4>
                  <ul className="space-y-1.5 text-xs text-slate-700">
                    {analysis.weaknesses.map((w, i) => (
                      <li key={i} className="flex items-center gap-2 bg-rose-50/60 p-2 rounded-lg border border-rose-100">
                        <span className="w-1.5 h-1.5 rounded-full bg-rose-500"></span> {w}
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="pt-2 border-t border-slate-100">
                  <h4 className="font-heading font-semibold text-xs uppercase tracking-wider text-gmu-navy flex items-center gap-1.5 mb-1.5">
                    <i className="lucide-sparkles w-4 h-4 text-gmu-gold"></i> Personalized AI Action Recommendations
                  </h4>
                  <p className="text-xs text-slate-700 leading-relaxed bg-amber-50/50 p-3 rounded-xl border border-amber-200">
                    {analysis.ai_recommendations}
                  </p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // ATTENDANCE ANALYSIS VIEW
    // -------------------------------------------------------------------------
    function AttendanceAnalysisView({ user, showToast }) {
      const [summaries, setSummaries] = useState([]);
      const [filterShortage, setFilterShortage] = useState(false);
      const [showMarkModal, setShowMarkModal] = useState(false);
      const [students, setStudents] = useState([]);
      const [subjects, setSubjects] = useState([]);
      const [form, setForm] = useState({ student_id: 1, subject_id: 1, status: "Present", remarks: "" });

      const loadSummaries = () => {
        fetch(`${API_BASE}/api/attendance/summary`)
          .then(r => r.json())
          .then(data => { if (data.success) setSummaries(data.summaries || []); });
      };

      useEffect(() => {
        loadSummaries();
        fetch(`${API_BASE}/api/students`).then(r => r.json()).then(d => setStudents(d.students || []));
        fetch(`${API_BASE}/api/subjects`).then(r => r.json()).then(d => setSubjects(d.subjects || []));
      }, []);

      const handleMarkAttendance = () => {
        fetch(`${API_BASE}/api/attendance`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(form)
        })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              showToast("Attendance logged!", "success");
              setShowMarkModal(false);
              loadSummaries();
            }
          });
      };

      const displayed = filterShortage ? summaries.filter(s => s.is_shortage) : summaries;

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          <div className="glass-card rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h3 className="font-heading font-bold text-base text-gmu-navy flex items-center gap-2">
                <i className="lucide-calendar-check w-5 h-5 text-gmu-gold"></i> Attendance Analysis & 75% Predictive Planner
              </h3>
              <p className="text-xs text-slate-500 mt-0.5">Automated detection of shortage below 75% and predictive classes needed calculation.</p>
            </div>
            <div className="flex items-center gap-3">
              <button 
                onClick={() => setFilterShortage(!filterShortage)}
                className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${
                  filterShortage ? 'bg-rose-50 text-rose-700 border-rose-300' : 'bg-slate-100 text-slate-700 border-slate-200'
                }`}
              >
                {filterShortage ? "Showing < 75% Shortage" : "Filter < 75% Shortage"}
              </button>
              {(user.role === "Administrator" || user.role === "Faculty") && (
                <button 
                  onClick={() => setShowMarkModal(true)}
                  className="px-4 py-1.5 bg-gmu-navy hover:bg-gmu-blue text-white rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1.5"
                >
                  <i className="lucide-plus w-4 h-4"></i> Log Attendance
                </button>
              )}
            </div>
          </div>

          <div className="glass-card rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table className="w-full text-left text-xs text-slate-700">
              <thead className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                <tr>
                  <th className="p-3.5">Reg Number</th>
                  <th className="p-3.5">Student Name</th>
                  <th className="p-3.5">Attended / Total</th>
                  <th className="p-3.5">Attendance %</th>
                  <th className="p-3.5">Status Tier</th>
                  <th className="p-3.5">Predictive AI Guidance</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {displayed.map(s => (
                  <tr key={s.student_id} className="hover:bg-slate-50 transition">
                    <td className="p-3.5 font-bold text-gmu-navy">{s.reg_number}</td>
                    <td className="p-3.5 font-semibold text-slate-800">{s.name}</td>
                    <td className="p-3.5">{s.attended_classes} / {s.total_classes} Sessions</td>
                    <td className="p-3.5 font-bold">
                      <span className={`px-2.5 py-1 rounded-full text-[11px] ${
                        s.percentage >= 75 ? 'bg-emerald-100 text-emerald-800' :
                        s.percentage >= 65 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'
                      }`}>
                        {s.percentage}%
                      </span>
                    </td>
                    <td className="p-3.5 font-semibold text-slate-600">{s.status}</td>
                    <td className="p-3.5 max-w-xs text-slate-600 text-[11px] leading-relaxed">{s.guidance}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Mark Attendance Modal */}
          {showMarkModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h4 className="font-heading font-bold text-sm text-gmu-navy">Log Subject Attendance</h4>
                  <button onClick={() => setShowMarkModal(false)}><i className="lucide-x w-5 h-5 text-slate-400"></i></button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Student</label>
                    <select 
                      value={form.student_id}
                      onChange={(e) => setForm({ ...form, student_id: Number(e.target.value) })}
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    >
                      {students.map(s => <option key={s.student_id} value={s.student_id}>{s.reg_number} — {s.first_name} {s.last_name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Subject</label>
                    <select 
                      value={form.subject_id}
                      onChange={(e) => setForm({ ...form, subject_id: Number(e.target.value) })}
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    >
                      {subjects.map(sub => <option key={sub.subject_id} value={sub.subject_id}>{sub.code} — {sub.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Attendance Status</label>
                    <select 
                      value={form.status}
                      onChange={(e) => setForm({ ...form, status: e.target.value })}
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    >
                      <option value="Present">Present</option>
                      <option value="Absent">Absent</option>
                      <option value="Late">Late Arrival</option>
                      <option value="Excused">Excused Medical</option>
                    </select>
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                  <button onClick={() => setShowMarkModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold">Cancel</button>
                  <button onClick={handleMarkAttendance} className="px-4 py-2 bg-gmu-navy text-white rounded-xl text-xs font-bold shadow-md">Save Record</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // FEEDBACK ANALYSIS VIEW
    // -------------------------------------------------------------------------
    function FeedbackAnalysisView({ user, showToast }) {
      const [feedbackList, setFeedbackList] = useState([]);
      const [rating, setRating] = useState(5);
      const [category, setCategory] = useState("Faculty & Teaching");
      const [targetName, setTargetName] = useState("Dr. Vikram Malhotra (AI)");
      const [comments, setComments] = useState("");
      const [loading, setLoading] = useState(false);

      const loadFeedback = () => {
        fetch(`${API_BASE}/api/feedback`).then(r => r.json()).then(d => { if (d.success) setFeedbackList(d.feedback || []); });
      };

      useEffect(() => { loadFeedback(); }, []);

      const handleSubmit = () => {
        if (!comments.trim()) return;
        setLoading(true);
        fetch(`${API_BASE}/api/feedback`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ category, target_name: targetName, rating, comments })
        })
          .then(res => res.json())
          .then(data => {
            setLoading(false);
            if (data.success) {
              showToast(`Review categorized as: ${data.sentiment}!`, "success");
              setComments("");
              loadFeedback();
            }
          })
          .catch(() => setLoading(false));
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          <div className="glass-card rounded-2xl p-6 shadow-sm border border-slate-200">
            <h3 className="font-heading font-bold text-base text-gmu-navy flex items-center gap-2">
              <i className="lucide-message-square-heart w-5 h-5 text-gmu-gold"></i> Student Feedback & AI Sentiment NLP Analyzer
            </h3>
            <p className="text-xs text-slate-500 mt-1">Submit qualitative reviews to automatically score sentiment and formulate administrative actions.</p>

            <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Feedback Category</label>
                <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                  <option value="Faculty & Teaching">Faculty & Teaching</option>
                  <option value="Lab Facilities">Lab Facilities</option>
                  <option value="Curriculum & Courses">Curriculum & Courses</option>
                  <option value="Campus Infrastructure">Campus Infrastructure</option>
                  <option value="Administration">Administration</option>
                </select>
              </div>
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Target Faculty / Lab</label>
                <input type="text" value={targetName} onChange={(e) => setTargetName(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" />
              </div>
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Rating (1 to 5 Stars)</label>
                <div className="flex items-center gap-2 py-1">
                  {[1, 2, 3, 4, 5].map(star => (
                    <button key={star} type="button" onClick={() => setRating(star)} className={`text-lg ${star <= rating ? 'text-amber-400' : 'text-slate-200'}`}>★</button>
                  ))}
                  <span className="text-xs font-bold text-slate-600 ml-2">{rating} / 5</span>
                </div>
              </div>
              <div className="md:col-span-3">
                <label className="block font-semibold text-slate-700 mb-1">Your Detailed Feedback</label>
                <textarea rows="3" value={comments} onChange={(e) => setComments(e.target.value)} placeholder="Share thoughts on lab GPUs, lecture clarity, or pacing..." className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl"></textarea>
              </div>
            </div>

            <div className="mt-3 flex justify-end">
              <button onClick={handleSubmit} disabled={loading || !comments.trim()} className="px-5 py-2.5 bg-gmu-navy hover:bg-gmu-blue text-white rounded-xl text-xs font-bold shadow-md transition flex items-center gap-2">
                <span>Submit & Run AI Sentiment Classifier</span>
              </button>
            </div>
          </div>

          <div className="space-y-3">
            <h4 className="font-heading font-semibold text-xs uppercase tracking-wider text-slate-500">Recent Student Reviews & NLP Insights</h4>
            {feedbackList.map(f => (
              <div key={f.feedback_id} className="glass-card rounded-2xl p-5 shadow-sm border border-slate-200 bg-white">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-xs text-gmu-navy">{f.target_name}</span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">{f.category}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                      f.sentiment === 'Positive' ? 'bg-emerald-100 text-emerald-800' :
                      f.sentiment === 'Negative' ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-700'
                    }`}>
                      {f.sentiment} ({Math.round((f.sentiment_score || 0.5) * 100)}% Confidence)
                    </span>
                    <span className="text-amber-400 text-xs">{"★".repeat(f.rating)}</span>
                  </div>
                </div>
                <p className="mt-2 text-xs text-slate-700 leading-relaxed italic">"{f.comments}"</p>
                {f.ai_summary && (
                  <div className="mt-2.5 p-2.5 bg-amber-50/60 rounded-xl text-[11px] text-gmu-navy border border-amber-200 flex items-start gap-1.5">
                    <i className="lucide-sparkles w-3.5 h-3.5 text-gmu-gold flex-shrink-0 mt-0.5"></i>
                    <span><strong>AI Remediation Action:</strong> {f.ai_summary}</span>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // STUDENTS CRUD VIEW
    // -------------------------------------------------------------------------
    function StudentsView({ user, showToast }) {
      const [students, setStudents] = useState([]);
      const [search, setSearch] = useState("");
      const [showAddModal, setShowAddModal] = useState(false);
      const [form, setForm] = useState({ reg_number: "", first_name: "", last_name: "", email: "", phone: "+91 9800000000", cgpa: 8.5 });

      const loadStudents = () => {
        fetch(`${API_BASE}/api/students?search=${encodeURIComponent(search)}`).then(r => r.json()).then(d => { if (d.success) setStudents(d.students || []); });
      };

      useEffect(() => { loadStudents(); }, [search]);

      const handleCreate = () => {
        fetch(`${API_BASE}/api/students`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(form)
        })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              showToast("Student created!", "success");
              setShowAddModal(false);
              setForm({ reg_number: "", first_name: "", last_name: "", email: "", phone: "+91 9800000000", cgpa: 8.5 });
              loadStudents();
            } else {
              showToast(data.message, "alert");
            }
          });
      };

      const handleDelete = (id) => {
        if (!confirm("Are you sure you want to delete this student?")) return;
        fetch(`${API_BASE}/api/students/${id}`, { method: "DELETE" }).then(() => { showToast("Student deleted.", "info"); loadStudents(); });
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          <div className="glass-card rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">

                <i className="lucide-users w-5 h-5 text-gmu-gold"></i> Student Management Database & Dossiers

              {(user.role === "Administrator" || user.role === "Faculty") && (
                <button onClick={() => setShowAddModal(true)} className="px-4 py-1.5 bg-gmu-navy hover:bg-gmu-blue text-white rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1.5">
                  <i className="lucide-plus w-4 h-4"></i> Add Student
                </button>
              )}
            </div>
          </div>

          <div className="glass-card rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table className="w-full text-left text-xs text-slate-700">
              <thead className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                <tr>
                  <th className="p-3.5">Reg Number</th>
                  <th className="p-3.5">Full Name</th>
                  <th className="p-3.5">Course</th>
                  <th className="p-3.5">Email</th>
                  <th className="p-3.5">CGPA</th>
                  <th className="p-3.5">Status</th>
                  {user.role === "Administrator" && <th className="p-3.5 text-right">Actions</th>}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {students.map(s => (
                  <tr key={s.student_id} className="hover:bg-slate-50 transition">
                    <td className="p-3.5 font-bold text-gmu-navy">{s.reg_number}</td>
                    <td className="p-3.5 font-semibold text-slate-800">{s.first_name} {s.last_name}</td>
                    <td className="p-3.5">{s.course_code || "BCA"}</td>
                    <td className="p-3.5 text-slate-500">{s.email}</td>
                    <td className="p-3.5 font-bold text-slate-900">{s.cgpa}</td>
                    <td className="p-3.5"><span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">{s.status}</span></td>
                    {user.role === "Administrator" && (
                      <td className="p-3.5 text-right">
                        <button onClick={() => handleDelete(s.student_id)} className="text-rose-500 hover:text-rose-700 p-1"><i className="lucide-trash-2 w-4 h-4"></i></button>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {showAddModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h4 className="font-heading font-bold text-sm text-gmu-navy">Register New Student</h4>
                  <button onClick={() => setShowAddModal(false)}><i className="lucide-x w-5 h-5 text-slate-400"></i></button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Registration Number</label>
                    <input type="text" value={form.reg_number} onChange={(e) => setForm({ ...form, reg_number: e.target.value })} placeholder="e.g. BCA24020" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">First Name</label>
                      <input type="text" value={form.first_name} onChange={(e) => setForm({ ...form, first_name: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Last Name</label>
                      <input type="text" value={form.last_name} onChange={(e) => setForm({ ...form, last_name: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Email</label>
                    <input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Initial CGPA</label>
                    <input type="number" step="0.1" value={form.cgpa} onChange={(e) => setForm({ ...form, cgpa: parseFloat(e.target.value) })} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                  <button onClick={() => setShowAddModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold">Cancel</button>
                  <button onClick={handleCreate} className="px-4 py-2 bg-gmu-navy text-white rounded-xl text-xs font-bold shadow-md">Save Record</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

                  <div className="flex items-center justify-between">
                    <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-gmu-goldDark border border-amber-200">{ev.category}</span>
                    <span className="text-[11px] text-slate-500 font-medium">{ev.event_date}</span>
                  </div>
                  <h4 className="font-heading font-bold text-sm text-gmu-navy mt-2">{ev.title}</h4>
                  <p className="text-xs text-slate-600 mt-1 line-clamp-3 leading-relaxed">{ev.description}</p>
                  <div className="mt-3 text-[11px] text-slate-500 space-y-1">
                    <p className="flex items-center gap-1.5"><i className="lucide-map-pin w-3.5 h-3.5 text-gmu-gold"></i> {ev.venue}</p>
                    <p className="flex items-center gap-1.5"><i className="lucide-users w-3.5 h-3.5 text-gmu-gold"></i> {ev.registered_count} / {ev.max_seats} Seats</p>
                  </div>
                </div>
                <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                  <span className="text-[10px] font-bold text-emerald-600 uppercase tracking-wider">{ev.status}</span>
                  <button onClick={() => handleRegister(ev.event_id)} className="px-3.5 py-1.5 bg-gmu-navy hover:bg-gmu-blue text-white text-xs font-bold rounded-xl shadow-sm transition">
                    1-Click Register
                  </button>
                </div>
              </div>
            ))}
          </div>

          {showCreateModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h4 className="font-heading font-bold text-sm text-gmu-navy">Publish Campus Event</h4>
                  <button onClick={() => setShowCreateModal(false)}><i className="lucide-x w-5 h-5 text-slate-400"></i></button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Title</label>
                    <input type="text" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Category</label>
                      <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl">
                        <option value="Technical">Technical</option>
                        <option value="Cultural">Cultural</option>
                        <option value="Sports">Sports</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Seminar">Seminar</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Date</label>
                      <input type="date" value={form.event_date} onChange={(e) => setForm({ ...form, event_date: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Venue</label>
                    <input type="text" value={form.venue} onChange={(e) => setForm({ ...form, venue: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Description</label>
                    <textarea rows="3" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"></textarea>
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                  <button onClick={() => setShowCreateModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold">Cancel</button>
                  <button onClick={handleCreate} className="px-4 py-2 bg-gmu-navy text-white rounded-xl text-xs font-bold shadow-md">Publish Event</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // RESOURCES VIEW
    // -------------------------------------------------------------------------
    function ResourcesView({ user, showToast }) {
      const [resources, setResources] = useState([]);
      const [showBookModal, setShowBookModal] = useState(false);
      const [selectedResource, setSelectedResource] = useState(null);
      const [purpose, setPurpose] = useState("AI Lab Project Practice");
      const [slot, setSlot] = useState("09:00 AM - 11:00 AM");

      const loadData = () => { fetch(`${API_BASE}/api/resources`).then(r => r.json()).then(d => setResources(d.resources || [])); };
      useEffect(() => { loadData(); }, []);

      const handleBook = () => {
        fetch(`${API_BASE}/api/resources/book`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ resource_id: selectedResource.resource_id, purpose, time_slot: slot, booking_date: new Date().toISOString().split("T")[0] })
        })
          .then(r => r.json())
          .then(data => {
            if (data.success) { showToast(data.message, "success"); setShowBookModal(false); loadData(); }
            else { showToast(data.message, "alert"); }
          });
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          <div className="glass-card rounded-2xl p-5 shadow-sm border border-slate-200">
            <h3 className="font-heading font-bold text-base text-gmu-navy flex items-center gap-2">
              <i className="lucide-building-2 w-5 h-5 text-gmu-gold"></i> Campus Resource & Laboratory Reservation System
            </h3>
            <p className="text-xs text-slate-500 mt-0.5">Manage smart classrooms, NVIDIA GPU labs, servers, and auditorium slots with conflict checking.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            {resources.map(r => (
              <div key={r.resource_id} className="glass-card rounded-2xl p-5 shadow-sm border border-slate-200 bg-white flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between">
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700">{r.resource_type}</span>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${r.status === 'Available' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>{r.status}</span>
                  </div>
                  <h4 className="font-heading font-bold text-sm text-gmu-navy mt-2">{r.name}</h4>
                  <p className="text-xs text-slate-500">{r.building} • Room {r.room_number}</p>
                  <p className="text-xs text-slate-600 mt-2 leading-relaxed bg-slate-50 p-2.5 rounded-xl border border-slate-100">{r.features}</p>
                </div>
                <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                  <span className="text-[11px] font-medium text-slate-500">Cap: {r.capacity} Seats</span>
                  <button onClick={() => { setSelectedResource(r); setShowBookModal(true); }} className="px-3.5 py-1.5 bg-gmu-navy hover:bg-gmu-blue text-white rounded-xl text-xs font-bold shadow-sm transition">
                    Reserve
                  </button>
                </div>
              </div>
            ))}
          </div>

          {showBookModal && selectedResource && (
            <div className="fixed inset-0 z-50 bg-slate-950/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h4 className="font-heading font-bold text-sm text-gmu-navy">Reserve: {selectedResource.name}</h4>
                  <button onClick={() => setShowBookModal(false)}><i className="lucide-x w-5 h-5 text-slate-400"></i></button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Time Slot</label>
                    <select value={slot} onChange={(e) => setSlot(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl">
                      <option value="09:00 AM - 11:00 AM">09:00 AM - 11:00 AM</option>
                      <option value="11:30 AM - 01:30 PM">11:30 AM - 01:30 PM</option>
                      <option value="02:00 PM - 04:00 PM">02:00 PM - 04:00 PM</option>
                      <option value="04:30 PM - 06:30 PM">04:30 PM - 06:30 PM</option>
                    </select>
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Purpose</label>
                    <input type="text" value={purpose} onChange={(e) => setPurpose(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                  <button onClick={() => setShowBookModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold">Cancel</button>
                  <button onClick={handleBook} className="px-4 py-2 bg-gmu-navy text-white rounded-xl text-xs font-bold shadow-md">Confirm</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // ADMISSIONS INQUIRIES MANAGER VIEW (ADMIN PORTAL)
    // -------------------------------------------------------------------------
    function AdmissionsManagerView({ user, showToast }) {
      const [inquiries, setInquiries] = useState([]);
      const loadInquiries = () => {
        fetch(`${API_BASE}/api/admissions`).then(r => r.json()).then(d => { if (d.success) setInquiries(d.inquiries || []); });
      };
      useEffect(() => { loadInquiries(); }, []);

      const updateStatus = (id, newStatus) => {
        fetch(`${API_BASE}/api/admissions/${id}/status`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus })
        })
          .then(r => r.json())
          .then(d => { if (d.success) { showToast(d.message, "success"); loadInquiries(); } });
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          <div className="glass-card rounded-2xl p-5 shadow-sm border border-slate-200">
            <h3 className="font-heading font-bold text-base text-gmu-navy flex items-center gap-2">
              <i className="lucide-inbox w-5 h-5 text-gmu-gold"></i> Admissions Application & Inquiry Management
            </h3>
            <p className="text-xs text-slate-500 mt-0.5">Real-time candidate submissions received from the GM University public admissions portal.</p>
          </div>

          <div className="glass-card rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table className="w-full text-left text-xs text-slate-700">
              <thead className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                <tr>
                  <th className="p-3.5">Applicant Name</th>
                  <th className="p-3.5">Contact (Email / Phone)</th>
                  <th className="p-3.5">Program Applied</th>
                  <th className="p-3.5">Score %</th>
                  <th className="p-3.5">Inquiry Message</th>
                  <th className="p-3.5">Status</th>
                  <th className="p-3.5 text-right">Update Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {inquiries.map(inq => (
                  <tr key={inq.inquiry_id} className="hover:bg-slate-50 transition">
                    <td className="p-3.5 font-bold text-gmu-navy">{inq.full_name}</td>
                    <td className="p-3.5">
                      <p className="font-medium text-slate-800">{inq.email}</p>
                      <p className="text-slate-400 text-[10px]">{inq.phone}</p>
                    </td>
                    <td className="p-3.5 font-semibold text-slate-700">{inq.program_interested}</td>
                    <td className="p-3.5 font-bold text-slate-900">{inq.academic_score || "N/A"}%</td>
                    <td className="p-3.5 max-w-xs text-slate-500 text-[11px] truncate">{inq.message || "—"}</td>
                    <td className="p-3.5">
                      <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                        inq.status === 'Admitted' ? 'bg-emerald-100 text-emerald-800' :
                        inq.status === 'Under Review' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'
                      }`}>
                        {inq.status}
                      </span>
                    </td>
                    <td className="p-3.5 text-right space-x-1">
                      <select 
                        value={inq.status}
                        onChange={(e) => updateStatus(inq.inquiry_id, e.target.value)}
                        className="p-1 bg-slate-100 border border-slate-200 rounded text-[11px] font-semibold"
                      >
                        <option value="New">New</option>
                        <option value="Under Review">Under Review</option>
                        <option value="Interview Scheduled">Interview</option>
                        <option value="Admitted">Admitted</option>
                        <option value="Rejected">Rejected</option>
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Render into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Initialize Lucide icons
    setTimeout(() => {
      if (window.lucide) window.lucide.createIcons();
    }, 400);
  </script>
</body>
</html>
